services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: enterprise_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enterprise_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build: .
    command: uvicorn gateway.app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  summarizer-service:
    build: .
    command: uvicorn services.summarizer.app.main:app --host 0.0.0.0 --port 8001
    env_file: .env
    ports: ["8001:8001"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}

  meeting-insights-service:
    build: .
    command: uvicorn services.meeting_insights.app.main:app --host 0.0.0.0 --port 8002
    env_file: .env
    ports: ["8002:8002"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}

  ticket-classifier-service:
    build: .
    command: uvicorn services.ticket_classifier.app.main:app --host 0.0.0.0 --port 8003
    env_file: .env
    ports: ["8003:8003"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}

  contract-analyzer-service:
    build: .
    command: uvicorn services.contract_analyzer.app.main:app --host 0.0.0.0 --port 8004
    env_file: .env
    ports: ["8004:8004"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}

volumes:
  pg_data:
  redis_data:
